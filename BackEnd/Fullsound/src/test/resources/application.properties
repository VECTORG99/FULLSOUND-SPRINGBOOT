# ============================================================
# FULLSOUND - Test Configuration (H2 in-memory)
# ============================================================
# Permite ejecutar los tests sin una base de datos PostgreSQL real.
# El schema se genera desde las entidades JPA (ddl-auto=create-drop)
# y Flyway se deshabilita para no requerir sintaxis PostgreSQL.
# ============================================================

# ==================== APPLICATION ====================
spring.application.name=FullSound Backend API (Test)
server.port=0

# ==================== DATABASE - H2 ====================
spring.datasource.url=jdbc:h2:mem:fullsound_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ==================== JPA/HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==================== FLYWAY (disabled in tests) ====================
spring.flyway.enabled=false

# ==================== JWT SECURITY ====================
jwt.secret=test-secret-key-for-jwt-token-generation-must-be-long-enough-for-hs512-algorithm-fullsound-test
jwt.expiration=86400000

# ==================== STRIPE PAYMENT ====================
stripe.api.key=sk_test_disabled
stripe.webhook.secret=whsec_disabled

# ==================== SUPABASE (mock values for tests) ====================
supabase.url=https://test.supabase.co
supabase.key=test-supabase-anon-key

# ==================== SWAGGER/OPENAPI ====================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
